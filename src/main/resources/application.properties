server.port=9000
io.betterbanking.integration.url-base=http://127.0.0.1:8081
spring.datasource.url=jdbc:mysql://localhost:3306/better_banking?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.main.allow-bean-definition-overriding=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://127.0.0.1:9001/realms/open-banking-realm
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.oauth2=TRACE
logging.level.org.keycloak.authentication=DEBUG
keycloak.realm=master
keycloak.resource=open-banking
keycloak.auth-server-url=http://127.0.0.1:9001
keycloak.ssl-required=external
keycloak.public-client=false
