server.port=9000
io.betterbanking.integration.url-base=http://localhost:8081
spring.datasource.url=jdbc:mysql://localhost:3306/better_banking?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.main.allow-bean-definition-overriding=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/open-banking-realm

logging.level.org.springframework.security=DEBUG
logging.level.org.keycloak.authentication=DEBUG
keycloak.realm=master
keycloak.resource=open-banking
keycloak.auth-server-url=http://localhost:8080/realms/open-banking-realm/protocol/openid-connect/auth
keycloak.ssl-required=external
keycloak.public-client=false
