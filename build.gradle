plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.24.0'
}

group = 'io.better-banking'
version = '0.0.1-SNAPSHOT'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

//    testImplementation('org.springframework.boot:spring-boot-starter-test') {
//        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
//    }
    implementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'mysql:mysql-connector-java:8.0.33'
    testImplementation("org.testcontainers:testcontainers:2.0.5")
    testImplementation("org.testcontainers:testcontainers-junit-jupiter:2.0.5")
    testImplementation 'org.testcontainers:testcontainers-mysql:2.0.5'
    testImplementation 'io.rest-assured:spring-mock-mvc:3.0.0'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.22'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-aop:3.2.0'
    implementation 'io.github.resilience4j:resilience4j-spring-boot2:2.1.0'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('srcZip', Zip) {
    classifier = 'src'
    from projectDir
    include 'src/**/*'
    include '*.gradle'
    include 'README.md'
    doLast {
        println "Path to zip: $archivePath.path"
    }
}

openApiGenerate {
    generatorName.set("spring")
    generateModelDocumentation = false
    generateApiDocumentation = false
    inputSpec = "$projectDir/open_api/open-banking.yaml"
    outputDir = "$projectDir/generated"
    apiPackage = "com.acme.banking.api"
    modelPackage = "com.acme.banking.model"
    invokerPackage = "com.acme.banking.invoker"
    configOptions.set([
            dateLibrary: "java17",
            basePackage: "com.acme.banking",
            interfaceOnly: "true",
            useSpringBoot3: "true",
            useBeanValidation: "false"
    ])
}

tasks.register('copyGenerated',Copy) {
    from "$projectDir/generated/src/main/java/com/acme/banking/model"
    into "$projectDir/src/main/java/com/acme/banking/model"
}
tasks.register('cleanGenerated',Delete) {
    delete "$projectDir/src/main/java/com"
}
clean.dependsOn cleanGenerated